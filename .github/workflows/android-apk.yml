# Fabrique l'APK Android de Marie (dossier android/), non signé, et le dépose sur la branche android-apk.
name: APK Android

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Construire l'APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: marie-apk-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Déposer sur la branche android-apk
        run: |
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/marie-unsigned.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan android-apk
          git rm -rq --cached .
          cp /tmp/marie-unsigned.apk marie-unsigned.apk
          git add marie-unsigned.apk
          git commit -q -m "APK Android non signé depuis ${GITHUB_SHA}"
          git push -f origin android-apk
